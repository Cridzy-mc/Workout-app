<script>
"use strict";
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, "0");
const dkey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseD(k); d.setDate(d.getDate() + n); return dkey(d); };
const diffDays = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const fmtD = k => parseD(k).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
const r1 = n => Math.round(n * 10) / 10;
const num = v => parseFloat(String(v ?? "").replace(",", "."));
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const typing = () => { const a = document.activeElement; return !!a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName); };

/* ================= storage: Claude account when opened in Claude, phone storage otherwise ================= */
const Store = {
  mode: "device", data: {}, dirty: new Set(), timers: {}, writing: {}, col: null, onChange: null,
  init(onChange) {
    this.onChange = onChange;
    this.data = lsGet("cc:data") || {};
    if (window.claude && typeof window.claude.use === "function") this.connect();
  },
  async connect() {
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      this.col = db.collection("data/users/" + id);
      let first = true;
      this.col.onSnapshot(snap => {
        const remote = {};
        snap.docs.forEach(d => { remote[d.id] = d.data(); });
        if (first && !snap.metadata?.fromCache) {
          first = false;
          Object.keys(this.data).forEach(k => { if (!(k in remote)) this.queue(k); });
        }
        Object.keys(remote).forEach(k => { if (!this.dirty.has(k)) this.data[k] = JSON.parse(JSON.stringify(remote[k])); });
        this.mode = "cloud";
        lsSet("cc:data", this.data);
        this.onChange && this.onChange();
      }, () => { this.mode = "device"; this.onChange && this.onChange(); });
    } catch (e) { /* stay on phone storage */ }
  },
  get(k, def) { return this.data[k] ?? def; },
  put(k, v) { this.data[k] = v; lsSet("cc:data", this.data); this.queue(k); },
  queue(k) {
    if (!this.col) return;
    this.dirty.add(k);
    clearTimeout(this.timers[k]);
    this.timers[k] = setTimeout(() => this.flush(k), 700);
  },
  async flush(k) {
    if (this.writing[k]) { this.timers[k] = setTimeout(() => this.flush(k), 400); return; }
    this.writing[k] = true; this.timers[k] = null;
    try { await this.col.doc(k).set(JSON.parse(JSON.stringify(this.data[k]))); }
    catch (e) { toast("Couldn't sync. Saved on this phone."); }
    this.writing[k] = false;
    if (!this.timers[k]) this.dirty.delete(k);
  }
};

/* ================= AI (Claude) — only when opened inside Claude ================= */
const AI = {
  fn: null, tools: false, images: false, ready: false,
  async init() {
    if (window.claude && typeof window.claude.use === "function") {
      try {
        const s = await window.claude.use("sample");
        if (s) {
          this.fn = s;
          const lim = await s.limits().catch(() => null);
          this.tools = !!lim?.tools; this.images = !!lim?.images;
        }
      } catch (e) {}
    }
    this.ready = true;
    document.body.classList.toggle("hide-ai", !this.fn);
    if ($("#sheet").hidden && !typing()) render();
  },
  errText(e) {
    return ({ not_granted: "Claude wasn't allowed. Try again and tap Allow.", rate_limited: "Claude is busy or you've hit a usage limit. Try again in a bit.",
      sampling_disabled: "AI is turned off for your account.", prompt_too_large: "That was too much at once. Try a shorter message.",
      invalid_json: "Couldn't read that answer. Try again.", image_rejected: "That photo couldn't be read. Try another one.", cancelled: "Stopped." })[e?.code] || "The coach couldn't answer right now. Try again.";
  }
};

const BUILTIN = [

      { n: "Dumbbell Bench Press", sets: [3, 4, 4, 4], reps: "8–10", rest: 90 },
      { n: "One-arm Dumbbell Row", sets: [3, 3, 4, 4], reps: "10–12 / side", rest: 60 },
      { n: "Walking Lunges", sets: 3, reps: "10 / leg", rest: 60 },
      { n: "Plank", t: "time", sets: 3, reps: ["30 s", "40 s", "45 s", "60 s"], rest: 45 },
      { n: "Finisher: bike sprints 20 s hard / 40 s easy", t: "time", sets: [6, 7, 8, 8], reps: "1 min", rest: 0 }
    ] },
  { id: "hiit", name: "Intervals + Core", kind: "cardio", mins: 35, focus: "Short, hard conditioning",
    ex: [
      { n: "Warm-up walk, easy pace", t: "time", sets: 1, reps: "5 min", rest: 0 },
      { n: "Bike intervals: 30 s hard / 90 s easy", t: "time", sets: [8, 10, 12, 12], reps: "2 min", rest: 0 },
      { n: "Cool-down walk", t: "time", sets: 1, reps: "5 min", rest: 0 },
      { n: "Dead Bug", sets: 3, reps: "10 / side", rest: 30 },
      { n: "Side Plank", t: "time", sets: 2, reps: "30 s / side", rest: 30 }
    ] },
  { id: "str-b", name: "Strength B — Hinge & Pull", kind: "strength", mins: 55, focus: "Full body, deadlift + pull",
    ex: [
      { n: "Warm-up walk or bike", t: "time", sets: 1, reps: "5 min", rest: 0 },
      { n: "Romanian Deadlift", sets: [3, 4, 4, 4], reps: "8–10", rest: 90 },
      { n: "Lat Pulldown or Assisted Pull-up", sets: [3, 4, 4, 4], reps: "8–12", rest: 75 },
      { n: "Overhead Dumbbell Press", sets: 3, reps: "8–10", rest: 75 },

    ] },
  { id: "z2", name: "Zone 2 Cardio + Core", kind: "cardio", mins: 55, focus: "Long steady burn, easy on joints",
    ex: [
      { n: "Incline walk at talking pace", t: "time", sets: 1, reps: ["40 min", "45 min", "50 min", "50 min"], rest: 0 },
      { n: "Bird Dog", sets: 3, reps: "10 / side", rest: 30 },

    ] },
  { id: "metcon", name: "Strength C — Circuit", kind: "strength", mins: 45, focus: "Whole-body circuit, little rest",
    ex: [
      { n: "Warm-up: march + arm circles", t: "time", sets: 1, reps: "5 min", rest: 0 },
      { n: "Kettlebell Swing", sets: [4, 4, 5, 5], reps: "15", rest: 0 },
      { n: "Push-ups (knees or incline OK)", sets: [4, 4, 5, 5], reps: "8–12", rest: 0 },
      { n: "Dumbbell Thruster", sets: [4, 4, 5, 5], reps: "10", rest: 0 },
      { n: "Bent-over Dumbbell Row", sets: [4, 4, 5, 5], reps: "10", rest: 0 },
      { n: "Jumping Jacks", t: "time", sets: [4, 4, 5, 5], reps: "40 s", rest: 90, note: "Rest 90 s after each full round, then go back to swings." }

/* ================= nutrition math ================= */
function latestWeight() {
  const ws = (core().weights || []).slice().sort((a, b) => a.d < b.d ? -1 : 1);
  return ws.length ? ws[ws.length - 1].kg : (core().profile?.weight || null);
}
function targets() {
  const p = core().profile;
  if (!p || !p.weight || !p.height || !p.age) return null;
  const w = latestWeight() || p.weight;
  const bmr = 10 * w + 6.25 * p.height - 5 * p.age + (p.sex === "f" ? -161 : 5);
  const tdee = bmr * (+p.activity || 1.5);
  const floor = p.sex === "f" ? 1300 : 1600;
  const deficit = Math.min(1000, Math.max(500, tdee * 0.3));
  const kcal = Math.round(Math.max(floor, tdee - deficit + (core().kcalAdjust || 0)) / 10) * 10;
  const goalW = p.goal || w * 0.75;
  const protein = Math.round(Math.max(1.8 * Math.min(w, goalW + 10), 120) / 5) * 5;
  const fat = Math.round(Math.max(0.6 * goalW, 50) / 5) * 5;
  const carbs = Math.max(50, Math.round((kcal - protein * 4 - fat * 9) / 4 / 5) * 5);
  return { bmr: Math.round(bmr), tdee: Math.round(tdee), kcal, protein, fat, carbs, kgWeek: (tdee - kcal) * 7 / 7700, w, goalW, floor };
}
function projection(weeks) {
  const t = targets(); if (!t) return [];
  const p = core().profile;
  let w = p.weight; const out = [{ wk: 0, kg: w }];
  for (let i = 1; i <= weeks; i++) {
    const bmr = 10 * w + 6.25 * p.height - 5 * p.age + (p.sex === "f" ? -161 : 5);
    const tdee = bmr * (+p.activity || 1.5);
    const kcal = Math.max(t.floor, tdee - Math.min(1000, Math.max(500, tdee * 0.3)));
    w -= (tdee - kcal) * 7 / 7700 + (i === 1 ? 2 : 0);
    out.push({ wk: i, kg: r1(Math.max(w, p.goal || 0)) });
    if (p.goal && w <= p.goal) break;
  }
  return out;
}

function gamePlan(k = dkey()) {
  const t = targets(), d = day(k), w = progWeek(k), wo = todaysWorkout(k);
  const kT = t?.kcal || 2000, pT = t?.protein || 150, eaten = sumK(d), prot = sumP(d), hr = new Date().getHours();
  const items = [];
  if (!core().profile) items.push({ done: false, text: "Set up your numbers", sub: "2 minutes. Gives you calorie and protein targets.", act: "profile" });
  items.push(d.sessions.length ? { done: true, text: `Workout done: ${d.sessions[0].name}`, sub: `${d.sessions[0].mins} min · ${d.sessions[0].sets} sets` }
    : { done: false, text: `Train: ${wo ? wo.name : "rest"}`, sub: wo ? `About ${wo.mins} min. Tap to start.` : "", act: "start", id: wo?.id });
  const pLeft = Math.max(0, pT - prot);
  items.push(pLeft <= 5 ? { done: true, text: `Protein hit: ${Math.round(prot)} g`, sub: "This is what keeps your muscle while you cut." }
    : { done: false, text: `Eat ${Math.round(pLeft)} g more protein`, sub: pLeft > 60 ? "Easy wins: chicken breast (46 g), whey shake (24 g), Greek yogurt (20 g)." : pLeft > 25 ? "Greek yogurt or cottage cheese closes most of that gap." : "A whey shake or 2 eggs does it.", act: "tab", v: "food" });
  const left = kT - eaten;
  if (left < -150) items.push({ done: false, text: `${-left} kcal over today`, sub: "No punishment needed. Take a 30-minute walk, then eat normally tomorrow. One day doesn't decide anything." });
  else items.push({ done: eaten > 0 && left < 250 && hr >= 19, text: eaten ? `${left} kcal left today` : "Log your first meal", sub: eaten ? (left > 900 && hr >= 18 ? "Don't skip dinner. Big lean protein + veg plate." : "Stay inside your number.") : `Target ${kT} kcal. Log as you go, it takes seconds.`, act: "tab", v: "food" });
  const sT = STEPS[w - 1];
  items.push((d.steps || 0) >= sT ? { done: true, text: `Steps: ${d.steps.toLocaleString()}`, sub: "Steps are your biggest fat burner." }
    : { done: false, text: `Walk ${(sT - (d.steps || 0)).toLocaleString()} more steps`, sub: "A 10-minute walk after each meal covers about 3,000.", act: "steps" });
  items.push((d.water || 0) >= 12 ? { done: true, text: "Water: 3 L", sub: "" } : { done: false, text: `Drink ${r1((12 - (d.water || 0)) * 0.25)} L more water`, sub: "Hunger is often thirst. A glass before each meal.", act: "water" });
  const weighed = (core().weights || []).some(z => z.d === k);
  items.push(weighed ? { done: true, text: "Weighed in", sub: "" } : { done: false, text: "Weigh in", sub: "Morning, after the toilet, before food. Only the weekly average matters.", act: "weigh" });
  return items;
}
function weekInsights() {
  const out = [], t = targets();
  const ws = (core().weights || []).slice().sort((a, b) => a.d < b.d ? -1 : 1);
  const avg = (from, to) => { const s = ws.filter(z => z.d > from && z.d <= to); return s.length ? s.reduce((a, z) => a + z.kg, 0) / s.length : null; };
  const k = dkey(), a1 = avg(addDays(k, -7), k), a0 = avg(addDays(k, -14), addDays(k, -7));
  if (a1 && a0) { const ch = r1(a1 - a0); out.push(ch < -1.6 ? `Weekly average down ${-ch} kg. That's fast. If you feel weak, add 150 kcal.` : ch <= -0.3 ? `Weekly average down ${-ch} kg. Right on track.` : `Weekly average changed ${ch > 0 ? "+" : ""}${ch} kg. If it's flat 2 weeks running, drop 150 kcal or add 2,000 steps.`); }
  const days = [...Array(7)].map((_, i) => day(addDays(k, -i)));
  const logged = days.filter(d => d.food.length);
  if (logged.length) { const ak = Math.round(logged.reduce((s, d) => s + sumK(d), 0) / logged.length); out.push(`Average intake ${ak} kcal on ${logged.length} logged day${logged.length > 1 ? "s" : ""}${t ? ` (target ${t.kcal})` : ""}.`); }

}

function planText(t, p) {

    <details><summary>Training rules</summary><ul class="tight small">

    <details><summary>Safety</summary><ul class="tight small">
      <li>See a doctor before starting, especially with blood pressure, diabetes, heart or joint problems, or medication.</li>
      <li>Stop if you get dizzy, chest pain, palpitations or feel faint.</li>
      <li>History of disordered eating? Work with a professional instead of tracking alone.</li></ul></details></section>`;
}
function chartProjection(pr, p) {
  if (pr.length < 2) return "";
  const W = 320, H = 150, L = 34, B = 20, T = 8, Rr = 8;
  const max = Math.ceil(pr[0].kg / 5) * 5, min = Math.floor(Math.min(...pr.map(x => x.kg), p.goal || 1e9) / 5) * 5;
  const n = pr[pr.length - 1].wk;
  const x = i => L + (W - L - Rr) * i / n, y = v => T + (H - T - B) * (max - v) / (max - min || 1);
  const ticks = []; for (let v = min; v <= max; v += Math.max(5, Math.round((max - min) / 4 / 5) * 5)) ticks.push(v);
  const four = pr.find(z => z.wk === 4);
  const actual = (core().weights || []).filter(z => z.d >= startDate()).sort((a, b) => a.d < b.d ? -1 : 1).map(z => `${x(diffDays(startDate(), z.d) / 7)},${y(z.kg)}`).join(" ");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Projected weight by week">
    ${ticks.map(v => `<line x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 4}" y="${y(v) + 3}" text-anchor="end">${v}</text>`).join("")}
    ${p.goal ? `<line x1="${L}" x2="${W - Rr}" y1="${y(p.goal)}" y2="${y(p.goal)}" stroke="var(--good)" stroke-dasharray="4 3"/><text x="${W - Rr}" y="${y(p.goal) - 4}" text-anchor="end" style="fill:var(--good)">goal ${p.goal}</text>` : ""}
    <rect x="${L}" y="${T}" width="${x(Math.min(4, n)) - L}" height="${H - T - B}" fill="var(--accent-soft)" opacity=".6"/>
    <polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 3" points="${pr.map(z => `${x(z.wk)},${y(z.kg)}`).join(" ")}"/>
    ${actual ? `<polyline fill="none" stroke="var(--fg)" stroke-width="2" points="${actual}"/>` : ""}
    ${four ? `<circle cx="${x(4)}" cy="${y(four.kg)}" r="4" fill="var(--accent)"/>` : ""}
    <text x="${L + 3}" y="${T + 11}" style="fill:var(--accent)">4 wks</text><text x="${L}" y="${H - 5}">start</text><text x="${W - Rr}" y="${H - 5}" text-anchor="end">week ${n}</text></svg>
    <p class="small muted">Dashed: projected. Shaded: this 4-week block.${actual ? " Solid: your weigh-ins." : ""}</p>`;
}
function chartWeights(ws, p) {
  if (ws.length < 2) return `<p class="small muted">Log your weight each morning. The trend line appears after two entries.</p>`;
  const W = 320, H = 150, L = 34, B = 20, T = 10, Rr = 10;
  const vals = ws.map(z => z.kg), mx = Math.ceil(Math.max(...vals) + 1), mn = Math.floor(Math.min(...vals) - 1);
  const d0 = ws[0].d, span = Math.max(1, diffDays(d0, ws[ws.length - 1].d));
  const x = d => L + (W - L - Rr) * diffDays(d0, d) / span, y = v => T + (H - T - B) * (mx - v) / (mx - mn);
  const avg = ws.map((z, i) => { const win = ws.slice(Math.max(0, i - 6), i + 1); return [z.d, win.reduce((s, q) => s + q.kg, 0) / win.length]; });
  const last = ws[ws.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Weight trend">
    ${[mn, Math.round((mn + mx) / 2), mx].map(v => `<line x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 4}" y="${y(v) + 3}" text-anchor="end">${v}</text>`).join("")}
    <polygon fill="var(--accent-soft)" points="${x(d0)},${H - B} ${avg.map(([d, v]) => `${x(d)},${y(v)}`).join(" ")} ${x(last.d)},${H - B}"/>
    ${ws.map(z => `<circle cx="${x(z.d)}" cy="${y(z.kg)}" r="2.5" fill="var(--muted)"/>`).join("")}
    <polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${avg.map(([d, v]) => `${x(d)},${y(v)}`).join(" ")}"/>
    <circle cx="${x(last.d)}" cy="${y(avg[avg.length - 1][1])}" r="4.5" fill="var(--accent)"/>
    <text x="${L}" y="${H - 5}">${fmtD(d0)}</text><text x="${W - Rr}" y="${H - 5}" text-anchor="end">${fmtD(last.d)}</text></svg>
    <p class="small muted">Dots: daily weigh-ins. Line: 7-day average${p?.goal ? ` · ${r1(avg[avg.length - 1][1] - p.goal)} kg to goal` : ""}.</p>`;
}

/* ================= workout sessions ================= */
function lastKgFor(name) {
  const keys = Object.keys(Store.data).filter(k => k.startsWith("day-")).sort().reverse();
  for (const k of keys) for (const s of (Store.data[k].sessions || [])) { const e = (s.ex || []).find(e => e.n === name); if (e && e.top) return e.top; }
  return "";
}
let wakeLock = null;
async function keepAwake(on) { try { if (on && navigator.wakeLock && !wakeLock) wakeLock = await navigator.wakeLock.request("screen"); if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; } } catch (e) { wakeLock = null; } }
const saveActive = () => lsSet("cc:active", UI.active);
function startSession(id, dayK) {
  const w = findW(id); if (!w) return;
  $("#sheet").hidden = true;
  if (UI.active && UI.active.id !== id) { toast("Finish or discard your current workout first"); UI.tab = "train"; render(); return; }
  if (!UI.active) {
    const k = dayK || dkey(), wk = progWeek(k);
    UI.active = { id: w.id, name: w.name, day: k, t0: Date.now(), cur: 0, ex: w.ex.map(e => { const lk = e.t === "time" ? "" : lastKgFor(e.n);
      return { n: e.n, t: e.t, reps: pick(e.reps, wk), rest: e.rest, note: e.note, lastKg: lk, log: [...Array(Math.max(1, pick(e.sets, wk)))].map(() => ({ kg: lk, reps: "", done: false })) }; }) };
    saveActive();
  }
  UI.tab = "train"; lsSet("cc:tab", "train"); keepAwake(true); render(); window.scrollTo(0, 0);
}
function setDone() {
  const a = UI.active, i = a.cur || 0, e = a.ex[i], j = e.log.findIndex(l => !l.done);
  if (j < 0) return;
  const l = e.log[j];
  if (e.t !== "time") { l.kg = $("#kg-in")?.value ?? l.kg; l.reps = $("#reps-in")?.value || l.reps || String(parseInt(e.reps) || 10); }
  l.done = true;
  const next = e.log[j + 1]; if (next && e.t !== "time" && !next.kg) next.kg = l.kg;
  stopClock();
  const last = j === e.log.length - 1;
  if (last && i < a.ex.length - 1) { a.cur = i + 1; toast(`Next: ${a.ex[i + 1].n}`); }
  saveActive(); render(); window.scrollTo(0, 0);
  if (e.rest && !(last && i === a.ex.length - 1)) startRest(e.rest);
}
function finishSession() {
  const a = UI.active; let vol = 0, sets = 0;
  const ex = a.ex.map(e => { let top = 0; e.log.forEach(l => { if (l.done) { sets++; const kg = num(l.kg) || 0, r = parseInt(l.reps) || parseInt(e.reps) || 0; vol += kg * r; top = Math.max(top, kg); } }); return { n: e.n, top: top || "", log: e.log.filter(l => l.done) }; });
  if (!sets) { toast("Complete at least one set first"); return; }
  const d = day(a.day), mins = Math.max(1, Math.round((Date.now() - a.t0) / 60000));
  d.sessions = [...(d.sessions || []), { id: a.id, name: a.name, mins, sets, vol, ex }];
  putDay(a.day, d);
  UI.active = null; saveActive(); stopRest(); stopClock(); keepAwake(false);
  UI.tab = "today"; lsSet("cc:tab", "today"); render(); window.scrollTo(0, 0);
  openSheet(`<div class="stack" style="text-align:center">${sheetHead("Workout saved")}<div class="big">${sets}</div><p class="label">sets in ${mins} min</p>
    ${vol ? `<p><strong>${Math.round(vol).toLocaleString()} kg</strong> lifted in total.</p>` : ""}<p class="small muted">Now: protein within 2 hours, and get your steps in.</p><button class="primary huge wide" data-act="close">Done</button></div>`);
}
let audioCtx = null;
function beep() { try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = 880; g.gain.value = 0.15; o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.25); } catch (e) {} }
function startRest(sec) {
  stopRest(); UI.rest = { end: Date.now() + sec * 1000 };
  const el = $("#rest"); el.hidden = false; document.body.classList.add("resting");
  const tick = () => { if (!UI.rest) return; const left = Math.ceil((UI.rest.end - Date.now()) / 1000);
    if (left <= 0) { clearInterval(UI.rest.iv); el.innerHTML = `<div class="grow"><div class="t">GO</div><div class="small">Rest's over</div></div><button data-act="stoprest">OK</button>`; try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) {} beep(); const mine = UI.rest; setTimeout(() => { if (UI.rest === mine) stopRest(); }, 4500); return; }
    el.innerHTML = `<div class="grow"><div class="t">${fmtClock(left)}</div><div class="small">Rest</div></div><button data-act="rest15">+15 s</button><button data-act="stoprest">Skip</button>`; };
  tick(); UI.rest.iv = setInterval(tick, 500);
}
function stopRest() { if (UI.rest) clearInterval(UI.rest.iv); UI.rest = null; $("#rest").hidden = true; document.body.classList.remove("resting"); }
function toggleClock(secs) {
  const i = UI.active.cur || 0;
  if (UI.clock && UI.clock.i === i) { stopClock(); render(); return; }
  stopClock(); UI.clock = { i, left: secs };
  UI.clock.iv = setInterval(() => { if (!UI.clock) return; UI.clock.left--; const el = $("#clock"); if (el) el.textContent = fmtClock(UI.clock.left);
    if (UI.clock.left <= 0) { stopClock(); beep(); try { navigator.vibrate && navigator.vibrate(300); } catch (e) {} setDone(); } }, 1000);
  render();
}
function stopClock() { if (UI.clock) clearInterval(UI.clock.iv); UI.clock = null; }

/* ================= food ================= */
function addFood(name, kcal, p, opts = {}) {
  const fk = opts.date || UI.foodDay || dkey(), d = day(fk), meal = opts.meal || UI.meal;
  d.food.push({ name, kcal: Math.round(kcal), p: r1(p || 0), meal });
  putDay(fk, d);
  if (!opts.noRecent) putCore({ recentFoods: [{ name, kcal: Math.round(kcal), p: r1(p || 0) }, ...(core().recentFoods || []).filter(f => f.name !== name)].slice(0, 15) });
  if (!opts.silent) { UI.foodQ = ""; toast(`Added ${Math.round(kcal)} kcal to ${meal}`); render(); }
}

const COACH_RULES = `You are "Coach", a direct, warm fitness and life coach inside the Cut Camp app. The person wants to lose 30-40 kg and asked for an intense but realistic plan. Rules:
- Be honest: fat loss is roughly 0.5-1.2 kg a week. Never promise more. Never suggest eating under their "floor" calories, multi-day fasts, pills, sweat suits or other crash methods.
- Use their real data (the JSON below) to give specific answers: numbers, foods, times. Keep replies short for a phone: under 120 words, short bullets, bold the single most important action.
- "Fix my life" means the basics: sleep, steps, protein, stress, alcohol, routines and small daily wins. Give concrete next steps, not lectures.
- When they report food, weight, steps or water, log it with the tools (estimate food calories and protein realistically) and say what you logged. Build workouts or change the schedule with tools when they ask.
- If they mention chest pain, fainting, injury or a medical condition, tell them to see a doctor. If they express hopelessness, self-harm or disordered eating, respond with care and encourage them to reach a professional or a local crisis line.
- Never invent data that isn't in the JSON.`;
const DAYNUM = { sun: 0, mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6 };
function coachTools(acts) {

    { name: "log_food", description: "Add eaten foods to the food log. Returns the new day totals.",
      inputSchema: { type: "object", properties: { items: { type: "array", items: { type: "object", properties: { name: { type: "string" }, kcal: { type: "number" }, protein: { type: "number" } }, required: ["name", "kcal"] } }, meal: { type: "string", enum: ["Breakfast", "Lunch", "Dinner", "Snacks"] }, date: { type: "string", description: "YYYY-MM-DD, default today" } }, required: ["items"] },
      execute(inp) { const items = Array.isArray(inp.items) ? inp.items.slice(0, 15) : []; if (!items.length) throw new Error("no items"); const date = dateOr(inp.date), meal = ["Breakfast", "Lunch", "Dinner", "Snacks"].includes(inp.meal) ? inp.meal : guessMeal();
        items.forEach(x => addFood(String(x.name || "Food").slice(0, 80), Math.max(0, +x.kcal || 0), Math.max(0, +x.protein || 0), { date, meal, silent: true, noRecent: true }));
        acts.push(`Logged ${items.length} food${items.length > 1 ? "s" : ""} (${Math.round(items.reduce((s, x) => s + (+x.kcal || 0), 0))} kcal) to ${meal}`);
        const d = day(date); return { date, day_kcal: sumK(d), day_protein: Math.round(sumP(d)) }; } },
    { name: "log_weight", description: "Record a body-weight weigh-in in kg.", inputSchema: { type: "object", properties: { kg: { type: "number" }, date: { type: "string" } }, required: ["kg"] },
      execute(inp) { const kg = +inp.kg; if (!(kg > 30 && kg < 400)) throw new Error("weight out of range"); const dd = dateOr(inp.date);
        putCore({ weights: [...(core().weights || []).filter(z => z.d !== dd), { d: dd, kg: r1(kg) }] }); acts.push(`Logged weight ${r1(kg)} kg`); return "ok"; } },
    { name: "log_activity", description: "Set today's step count and/or add water in ml.", inputSchema: { type: "object", properties: { steps: { type: "number" }, water_ml: { type: "number" } } },
      execute(inp) { const d = day(dkey()); if (inp.steps != null) { d.steps = Math.max(0, Math.round(+inp.steps || 0)); acts.push(`Steps set to ${d.steps.toLocaleString()}`); }
        if (inp.water_ml) { d.water = Math.max(0, (d.water || 0) + Math.round((+inp.water_ml || 0) / 250)); acts.push(`Added ${Math.round(+inp.water_ml)} ml water`); } putDay(dkey(), d); return "ok"; } },
    { name: "create_workout", description: "Create a custom workout the person can start from the Train tab. Use standard exercise names (e.g. 'Goblet Squat', 'Push-ups', 'Romanian Deadlift', 'Plank') so the 3D demo matches. Returns its id.",
      inputSchema: { type: "object", properties: { name: { type: "string" }, minutes: { type: "number" }, focus: { type: "string" }, exercises: { type: "array", items: { type: "object", properties: { name: { type: "string" }, sets: { type: "number" }, reps: { type: "string", description: "e.g. '10' or '40 s' or '5 min'" }, rest_s: { type: "number" } }, required: ["name"] } } }, required: ["name", "exercises"] },
      execute(inp) { const ex = (Array.isArray(inp.exercises) ? inp.exercises : []).slice(0, 20).map(e => { const reps = String(e.reps || "10").slice(0, 20); return { n: String(e.name || "Exercise").slice(0, 60), sets: Math.min(10, Math.max(1, parseInt(e.sets) || 3)), reps, rest: Math.min(300, Math.max(0, parseInt(e.rest_s) || 60)), t: parseTime(reps) ? "time" : undefined }; });
        if (!ex.length) throw new Error("no exercises"); const w = { id: "c-" + uid(), name: String(inp.name || "Coach workout").slice(0, 60), mins: Math.max(5, parseInt(inp.minutes) || 30), focus: String(inp.focus || "").slice(0, 60), kind: "custom", ex };
        putCore({ custom: [...(core().custom || []), w] }); acts.push(`Created workout "${w.name}"`); return { id: w.id }; } },
    { name: "set_schedule", description: "Assign a workout id to a weekday in the weekly schedule.", inputSchema: { type: "object", properties: { weekday: { type: "string", enum: ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"] }, workout_id: { type: "string" } }, required: ["weekday", "workout_id"] },
      execute(inp) { const dn = DAYNUM[String(inp.weekday || "").slice(0, 3).toLowerCase()]; if (dn == null || !findW(String(inp.workout_id))) throw new Error("unknown weekday or workout id");

}
async function ask(text) {
  text = String(text || "").trim(); if (!text || !AI.fn || UI.busy) return;
  UI.chat.push({ role: "user", content: text.slice(0, 2000) });
  UI.chat = UI.chat.slice(-20); lsSet("cc:chat", UI.chat);
  const ctl = new AbortController(), acts = [];
  UI.busy = { ctl, text: "" }; UI.tab = "coach"; render();
  const input = [{ role: "user", content: COACH_RULES + "\n\nTheir data:\n" + coachContext() + "\n\nTheir messages follow." }, ...UI.chat.map(m => ({ role: m.role, content: m.content }))];
  try {
    const opts = { signal: ctl.signal, cache: false, onText: ({ text: tx }) => { if (!UI.busy) return; UI.busy.text = tx; const el = $("#streaming"); if (el) el.innerHTML = md(tx); const log = $("#chatlog"); if (log) log.scrollTop = log.scrollHeight; } };
    if (AI.tools) opts.tools = coachTools(acts);
    const res = await AI.fn(input, opts);
    UI.chat.push({ role: "assistant", content: res.text || "Done.", acts });
  } catch (e) {
    UI.chat.push({ role: "assistant", content: (e?.text ? e.text + "\n\n" : "") + AI.errText(e), acts });
  }
  UI.busy = null; lsSet("cc:chat", UI.chat); render();
}

/* ================= events ================= */
document.addEventListener("click", ev => {
  if (ev.target === $("#sheet")) { closeSheet(); return; }
  const b = ev.target.closest("[data-act],[data-tab]");
  if (!b) return;
  if (b.dataset.tab) { UI.tab = b.dataset.tab; lsSet("cc:tab", UI.tab); render(); window.scrollTo(0, 0); return; }
  if (b.tagName === "INPUT" || b.tagName === "SELECT" || b.tagName === "TEXTAREA") return;
  const a = b.dataset.act, v = b.dataset.v, k = dkey();
  switch (a) {
    case "tab": $("#sheet").hidden = true; UI.tab = v; lsSet("cc:tab", v); render(); window.scrollTo(0, 0); break;
    case "profile": profileSheet(); break;
    case "skipwelcome": putCore({ skipWelcome: true }); render(); break;
    case "close": closeSheet(); break;
    case "sex": $("#p-sex").value = v; b.parentNode.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); break;
    case "start": if (b.dataset.id) startSession(b.dataset.id, b.dataset.day); break;
    case "preview": if (findW(b.dataset.id)) previewSheet(b.dataset.id); break;
    case "previewex": previewSheet(b.dataset.id, +v); break;
    case "figpause": b.textContent = Fig.toggle() ? "Play" : "Pause"; break;
    case "swap": swapSheet(); break;
    case "water": { const d = day(k); d.water = Math.max(0, (d.water || 0) + (+v || 1)); putDay(k, d); render(); break; }
    case "steps": numberSheet("Steps today", "Steps (see your Health app)", day(k).steps || "", "steps"); break;
    case "addsteps": { const d = day(k); d.steps = (d.steps || 0) + 1000; putDay(k, d); render(); break; }
    case "weigh": numberSheet("Log weight", "Morning weight (kg)", latestWeight() || "", "weigh", `<label class="field"><span class="label">Date</span><input id="nf-d" type="date" value="${k}" max="${k}"></label>`); break;
    case "delw": putCore({ weights: (core().weights || []).filter(z => z.d !== v) }); render(); break;
    case "habit": { const d = day(k); d.habits = Object.assign({}, d.habits, { [v]: !d.habits?.[v] }); putDay(k, d); render(); break; }
    case "sel": UI.sel = v; render(); break;
    case "resetsched": putCore({ schedule: {} }); toast("Schedule reset"); render(); break;
    case "neww": editorSheet(null); break;
    case "editw": editorSheet((core().custom || []).find(w => w.id === b.dataset.id)); break;
    case "copyw": { const src = findW(b.dataset.id), wk = progWeek(k); editorSheet({ id: "c-" + uid(), name: src.name + " (mine)", mins: src.mins, focus: src.focus, ex: src.ex.map(e => ({ n: e.n, t: e.t, sets: pick(e.sets, wk), reps: pick(e.reps, wk), rest: e.rest })) }); break; }
    case "exadd": UI.edit.ex.push({ n: "", sets: 3, reps: "10", rest: 60 }); drawEditor(); break;
    case "exdel": UI.edit.ex.splice(+b.dataset.i, 1); drawEditor(); break;
    case "wdel": if (b.dataset.sure) { putCore({ custom: (core().custom || []).filter(w => w.id !== UI.edit.id) }); closeSheet(); toast("Workout deleted"); } else { b.dataset.sure = "1"; b.textContent = "Tap again to delete"; } break;
    case "step": { const inp = $(b.dataset.f === "kg" ? "#kg-in" : "#reps-in"); if (!inp) break; const nv = Math.max(0, r1((num(inp.value) || 0) + +v)); inp.value = nv; const l = UI.active.ex[UI.active.cur || 0].log.find(x => !x.done); if (l) { l[b.dataset.f] = String(nv); saveActive(); } break; }
    case "setdone": setDone(); break;
    case "clock": toggleClock(+v); break;
    case "exnav": { const s = UI.active; s.cur = Math.max(0, Math.min(s.ex.length - 1, (s.cur || 0) + +v)); stopClock(); saveActive(); render(); window.scrollTo(0, 0); break; }
    case "jump": UI.active.cur = +v; saveActive(); stopClock(); closeSheet(); window.scrollTo(0, 0); break;
    case "overview": overviewSheet(); break;
    case "addset": { const e = UI.active.ex[UI.active.cur || 0], prev = e.log[e.log.length - 1]; e.log.push({ kg: prev?.kg || "", reps: "", done: false }); saveActive(); render(); break; }
    case "finish": finishSession(); break;
    case "cancel": if (b.dataset.sure) { UI.active = null; saveActive(); stopRest(); stopClock(); keepAwake(false); render(); } else { b.dataset.sure = "1"; b.textContent = "Tap again to discard"; } break;
    case "rest15": if (UI.rest) UI.rest.end += 15000; break;
    case "stoprest": stopRest(); break;
    case "meal": UI.meal = v; render(); break;
    case "portion": UI.portion = +v; b.parentNode.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); $("#foodres").innerHTML = foodResults(); break;
    case "fday": UI.foodDay = addDays(UI.foodDay || k, +v); if (UI.foodDay > k) UI.foodDay = k; render(); break;
    case "addfood": { const x = UI.portion; addFood(x === 1 ? b.dataset.n : `${b.dataset.n} ×${x}`, +b.dataset.k * x, +b.dataset.p * x); break; }
    case "copyyday": { const fk = UI.foodDay || k, src = day(addDays(fk, -1)); if (!src.food.length) { toast("Nothing logged the day before"); break; } const d = day(fk); d.food = [...d.food, ...src.food.map(f => ({ ...f }))]; putDay(fk, d); toast(`Copied ${src.food.length} items`); render(); break; }
    case "customfood": openSheet(`<form id="cf" class="stack">${sheetHead("My own numbers")}
      <label class="field"><span class="label">Name</span><input id="cf-n" required value="${esc(UI.foodQ)}" placeholder="e.g. Chicken wrap from café"></label>
      <div class="grid2"><label class="field"><span class="label">Calories</span><input id="cf-k" inputmode="numeric" required></label><label class="field"><span class="label">Protein (g)</span><input id="cf-p" inputmode="decimal" value="0"></label></div>
      <p class="small muted">Saved to your recent foods for one-tap logging next time.</p><button class="primary huge wide" type="submit">Add to ${UI.meal}</button></form>`); break;
    case "delfood": { const fk = UI.foodDay || k, d = day(fk); d.food.splice(+b.dataset.i, 1); putDay(fk, d); render(); break; }
    case "describe": { const t = $("#describe").value.trim(); if (!t) { toast("Type what you ate first"); break; } estimateFood(t, null); break; }
    case "snap": $("#photo").click(); break;
    case "ask": ask(v); break;
    case "send": { const box = $("#askbox"); const t = box.value; box.value = ""; ask(t); break; }
    case "stopai": UI.busy?.ctl.abort(); break;
    case "clearchat": UI.chat = []; lsSet("cc:chat", []); render(); break;
    case "restart": if (b.dataset.sure) { putCore({ start: dkey() }); toast("New 4-week block starts today"); render(); } else { b.dataset.sure = "1"; b.textContent = "Tap again to restart"; } break;
    case "export": { const txt = JSON.stringify(Store.data); const fallback = () => openSheet(`<div class="stack">${sheetHead("Backup")}<p class="small muted">Select all and copy into Notes.</p><textarea id="exp" readonly rows="8">${esc(txt)}</textarea></div>`);
      try { navigator.clipboard.writeText(txt).then(() => toast("Backup copied. Paste it into Notes."), fallback); } catch (e) { fallback(); } break; }
    case "import": openSheet(`<form id="imf" class="stack">${sheetHead("Restore backup")}<textarea id="imp" placeholder="Paste backup text here" required></textarea><p class="small muted">This replaces what's in the app now.</p><button class="primary huge wide" type="submit">Restore</button></form>`); break;
  }
});
document.addEventListener("input", ev => {
  const el = ev.target, a = el.dataset.act; if (!a) return;
  if (a === "foodq") { UI.foodQ = el.value; $("#foodres").innerHTML = foodResults(); }
  if (a === "setval") { const l = UI.active?.ex[UI.active.cur || 0].log.find(x => !x.done); if (l) { l[el.dataset.f] = el.value; saveActive(); } }
  if (a === "eset") { const e = UI.edit.ex[+el.dataset.i], f = el.dataset.f; e[f] = (f === "sets" || f === "rest") ? (parseInt(el.value) || 0) : el.value; }
});
document.addEventListener("keydown", ev => { if (ev.key === "Enter" && !ev.shiftKey && ev.target.id === "askbox") { ev.preventDefault(); const t = ev.target.value; ev.target.value = ""; ask(t); } });
document.addEventListener("change", ev => {
  const el = ev.target;
  if (el.dataset.act === "sched") { const s = Object.assign({}, core().schedule || {}); s[el.dataset.v] = el.value; putCore({ schedule: s }); toast(`${DOW[el.dataset.v]} updated`); render(); }
  if (el.id === "photo" && el.files?.[0]) { const f = el.files[0]; el.value = ""; estimateFood($("#describe")?.value.trim() || "", f); }
});
document.addEventListener("submit", ev => {
  ev.preventDefault();
  const f = ev.target, k = dkey();
  if (f.id === "pf") saveProfile();
  if (f.id === "nf") {
    const val = num($("#nf-v").value);
    if (!(val >= 0)) { toast("Enter a number"); return; }
    if (f.dataset.kind === "steps") { const d = day(k); d.steps = Math.round(val); putDay(k, d); }
    if (f.dataset.kind === "weigh") { const dd = $("#nf-d").value || k; putCore({ weights: [...(core().weights || []).filter(z => z.d !== dd), { d: dd, kg: r1(val) }] }); }
    closeSheet(); toast("Saved");
  }
  if (f.id === "cf") { const kc = num($("#cf-k").value); if (!(kc >= 0)) { toast("Enter calories"); return; } $("#sheet").hidden = true; addFood($("#cf-n").value.trim() || "Food", kc, num($("#cf-p").value) || 0); }
  if (f.id === "confirmfood") { let n = 0; (UI.pending || []).forEach((x, i) => { if ($("#cf-on-" + i)?.checked) { addFood(x.name, num($("#cf-k-" + i).value) || 0, num($("#cf-p-" + i).value) || 0, { silent: true }); n++; } });
    UI.pending = null; closeSheet(); const ds = $("#describe"); if (ds) ds.value = ""; toast(`Added ${n} item${n === 1 ? "" : "s"} to ${UI.meal}`); }
  if (f.id === "ef") {
    const w = UI.edit; w.name = $("#e-name").value.trim(); w.mins = parseInt($("#e-mins").value) || 30; w.focus = $("#e-focus").value.trim(); w.kind = "custom";
    w.ex = w.ex.filter(e => String(e.n).trim()); w.ex.forEach(e => { e.sets = Math.max(1, parseInt(e.sets) || 1); if (parseTime(e.reps)) e.t = "time"; else delete e.t; });
    if (!w.name || !w.ex.length) { toast("Add a name and at least one exercise"); return; }
    const list = (core().custom || []).filter(x => x.id !== w.id); list.push(w); putCore({ custom: list });
    UI.tab = "train"; closeSheet(); toast("Workout saved");
  }
  if (f.id === "imf") { try { const obj = JSON.parse($("#imp").value); if (typeof obj !== "object" || !obj) throw 0; Object.keys(obj).forEach(key => Store.put(key, obj[key])); closeSheet(); toast("Backup restored"); } catch (e) { toast("That text isn't a valid backup"); } }
});
document.addEventListener("visibilitychange", () => { if (!document.hidden && !typing() && $("#sheet").hidden && !UI.busy) render(); });

/* ================= boot ================= */
if (UI.active && UI.active.cur == null) UI.active.cur = 0;
if (!["today", "train", "food", "coach", "me"].includes(UI.tab)) UI.tab = "today";
document.body.classList.add("hide-ai");
Store.init(() => { if ($("#sheet").hidden && !typing() && !UI.busy && !UI.clock) render(); });
render();
AI.init();
if (UI.active) keepAwake(true);
setInterval(() => { if (UI.active && UI.tab === "train" && !typing() && $("#sheet").hidden && !UI.clock) render(); }, 60000);
</script>
